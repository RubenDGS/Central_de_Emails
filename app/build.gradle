plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pt.caixa6'
    compileSdk 35

    defaultConfig {
        applicationId "pt.caixa6"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.5"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("CENTRAL_KEYSTORE_FILE") ?: "central-emails.jks")
            storePassword System.getenv("CENTRAL_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("CENTRAL_KEY_ALIAS") ?: "centralemails"
            keyPassword System.getenv("CENTRAL_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview-beta-arm64-v8a:137.0.20250314092052"

    // Google Identity Services: versão indicada atualmente pela documentação Android.
    implementation "com.google.android.gms:play-services-auth:21.6.0"
}
