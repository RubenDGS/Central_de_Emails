name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restaurar chave de assinatura
        shell: bash
        run: |
          echo "${{ secrets.CENTRAL_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/central-emails.jks"
          echo "CENTRAL_KEYSTORE_FILE=$RUNNER_TEMP/central-emails.jks" >> "$GITHUB_ENV"

      - name: Compilar APK release assinado
        env:
          CENTRAL_KEYSTORE_PASSWORD: ${{ secrets.CENTRAL_KEYSTORE_PASSWORD }}
          CENTRAL_KEY_ALIAS: ${{ secrets.CENTRAL_KEY_ALIAS }}
          CENTRAL_KEY_PASSWORD: ${{ secrets.CENTRAL_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Central-de-Emails-release
          path: app/build/outputs/apk/release/app-release.apk
